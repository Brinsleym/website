# nginx site for the Hong Kong VPS, which serves mainland China.
#
# AliDNS answers www.brinsleymorrison.com with this server for visitors in
# mainland China, and with Cloudflare Pages for everyone else. The bare domain
# points here for everyone and only redirects to www. deploy/hk/setup.sh
# installs this as /etc/nginx/sites-available/brinsleymorrison.conf.
#
# Everyone who reaches www here is in China, so this does the job of
# functions/_middleware.js with the country fixed: "/" goes to /zh/ unless the
# visitor picked a language, and pages carry a `country=CN` cookie.

# Where "/" sends a visitor, from the `lang` cookie the language switcher sets.
map $cookie_lang $brinsley_home {
    default "/zh/";
    en      "";
    ja      "/ja/";
    zh      "/zh/";
}

# Baidu's site verification needs a 200 at "/", not a redirect to /zh/.
map $http_user_agent $brinsley_home_for_agent {
    ~*baidu "";
    default $brinsley_home;
}

# Only sent when the cookie isn't already CN (an empty header is not sent).
map $cookie_country $brinsley_country_cookie {
    default "country=CN; Path=/; Max-Age=86400; SameSite=Lax; Secure";
    CN      "";
}

# Each language has its own 404 page.
map $uri $brinsley_not_found {
    default  /404.html;
    ~^/ja/   /ja/404.html;
    ~^/zh/   /zh/404.html;
}

# Port 80: Let's Encrypt challenges for both names (Pages sends www's on to
# the bare domain), everything else to HTTPS on www.
server {
    listen 80;
    listen [::]:80;
    server_name brinsleymorrison.com www.brinsleymorrison.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://www.brinsleymorrison.com$request_uri;
    }
}

# The bare domain only redirects to www, for every visitor.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brinsleymorrison.com;

    include /etc/nginx/snippets/brinsleymorrison-tls.conf;

    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 301 https://www.brinsleymorrison.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.brinsleymorrison.com;

    include /etc/nginx/snippets/brinsleymorrison-tls.conf;

    # A symlink to the latest release (see .github/workflows/deploy.yml).
    root /var/www/brinsleymorrison/current;
    index index.html;
    error_page 404 $brinsley_not_found;

    # Directory redirects (/about -> /about/) stay relative, so on www.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript text/javascript text/plain application/xml application/rss+xml image/svg+xml application/json;

    # add_header in a location replaces the server's, so each location
    # includes the shared security headers.
    location = / {
        include /etc/nginx/snippets/brinsleymorrison-headers.conf;
        if ($brinsley_home_for_agent) {
            add_header Cache-Control "private, no-store" always;
            add_header Vary Cookie always;
            return 302 $brinsley_home_for_agent;
        }
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Set-Cookie $brinsley_country_cookie always;
        add_header Link '</llms.txt>; rel="describedby"; type="text/markdown", </sitemap.xml>; rel="sitemap"; type="application/xml"' always;
        try_files /index.html =404;
    }

    # The Japanese and Chinese homepages point at their own llms.txt.
    location ~ ^/(?<brinsley_lang>ja|zh)/$ {
        include /etc/nginx/snippets/brinsleymorrison-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Set-Cookie $brinsley_country_cookie always;
        add_header Link '</$brinsley_lang/llms.txt>; rel="describedby"; type="text/markdown", </sitemap.xml>; rel="sitemap"; type="application/xml"' always;
        try_files ${uri}index.html =404;
    }

    location ~ ^/(images|css|fonts|ionicons)/ {
        include /etc/nginx/snippets/brinsleymorrison-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(assets|audio|videos|doc)/ {
        include /etc/nginx/snippets/brinsleymorrison-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # Cloudflare Pages' own config files aren't part of the site.
    location ~ ^/(_headers|_routes\.json)$ {
        return 404;
    }

    # Pages, plus feeds, sitemaps and llms.txt.
    location / {
        include /etc/nginx/snippets/brinsleymorrison-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Set-Cookie $brinsley_country_cookie always;
        try_files $uri $uri/index.html $uri/ =404;
    }
}
