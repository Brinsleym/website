# Installed as /etc/nginx/snippets/brinsleymorrison-tls.conf.
# acme.sh installs the certificate here and reloads nginx when it renews
# (deploy/hk/setup.sh).
ssl_certificate     /etc/nginx/ssl/brinsleymorrison/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/brinsleymorrison/key.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:brinsley_tls:10m;
ssl_session_timeout 1d;
