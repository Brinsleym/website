# Deploys master to the Hong Kong VPS, which serves mainland China.
# (Cloudflare Pages deploys master for everyone else by itself.)
#
# Each deploy is uploaded as a new release next to the live one, then the
# `current` symlink nginx serves from is switched over, so visitors never see
# a half-copied site. The last 3 releases are kept for rollback.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   HK_HOST         the VPS's IP address
#   HK_USER         the deploy user (deploy/hk/setup.sh creates `deploy`)
#   HK_SSH_KEY      that user's private key (ed25519, no passphrase)
#   HK_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <HK_HOST>`
name: Deploy to Hong Kong

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-hk
  cancel-in-progress: false

jobs:
  # Skips the deploy, rather than failing, until the secrets are set up.
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          HK_HOST: ${{ secrets.HK_HOST }}
        run: echo "ready=$([ -n "$HK_HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build
        run: bash cloudflare/pages-build.sh

      - name: Set up SSH
        env:
          HK_SSH_KEY: ${{ secrets.HK_SSH_KEY }}
          HK_KNOWN_HOSTS: ${{ secrets.HK_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HK_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HK_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and switch over
        env:
          TARGET: ${{ secrets.HK_USER }}@${{ secrets.HK_HOST }}
          RELEASE: ${{ github.sha }}
        run: |
          base=/var/www/brinsleymorrison
          # Unchanged files are hard-linked from the live release, so only
          # what changed is uploaded.
          rsync -az --delete --link-dest="$base/current/" \
            public/ "$TARGET:$base/releases/$RELEASE/"
          ssh "$TARGET" "set -e
            cd $base
            ln -sfn releases/$RELEASE current.new
            mv -T current.new current
            ls -1dt releases/*/ | tail -n +4 | xargs -r rm -rf"
