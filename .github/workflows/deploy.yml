# Builds master once and deploys it to both places the site is served from:
#   - Cloudflare Pages, for everyone outside mainland China
#   - the Hong Kong VPS, for mainland China (see deploy/hk/README.md)
#
# On the VPS each deploy is uploaded as a new release next to the live one,
# then the `current` symlink nginx serves from is switched over, so visitors
# never see a half-copied site. The last 3 releases are kept for rollback.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token with Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
#   HK_HOST                the VPS's IP address
#   HK_USER                the deploy user (deploy/hk/setup.sh creates `deploy`)
#   HK_SSH_KEY             that user's private key (ed25519, no passphrase)
#   HK_KNOWN_HOSTS         output of `ssh-keyscan -t ed25519 <HK_HOST>`
# A target whose secrets aren't set yet is skipped rather than failed.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.secrets.outputs.pages }}
      hk: ${{ steps.secrets.outputs.hk }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HK_HOST: ${{ secrets.HK_HOST }}
        run: |
          echo "pages=$([ -n "$CLOUDFLARE_API_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "hk=$([ -n "$HK_HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build
        run: bash cloudflare/pages-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          include-hidden-files: true
          retention-days: 7

  pages:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The checkout supplies functions/, which wrangler bundles alongside.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name=brinsleymorrison --branch=master --commit-dirty=true

  hk:
    needs: build
    if: needs.build.outputs.hk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public/

      - name: Set up SSH
        env:
          HK_SSH_KEY: ${{ secrets.HK_SSH_KEY }}
          HK_KNOWN_HOSTS: ${{ secrets.HK_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HK_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HK_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and switch over
        env:
          TARGET: ${{ secrets.HK_USER }}@${{ secrets.HK_HOST }}
          RELEASE: ${{ github.sha }}
        run: |
          base=/var/www/brinsleymorrison
          # Unchanged files are hard-linked from the live release, so only
          # what changed is uploaded.
          rsync -az --delete --link-dest="$base/current/" \
            public/ "$TARGET:$base/releases/$RELEASE/"
          ssh "$TARGET" "set -e
            cd $base
            ln -sfn releases/$RELEASE current.new
            mv -T current.new current
            ls -1dt releases/*/ | tail -n +4 | xargs -r rm -rf"
