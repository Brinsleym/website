{{ $c := "c-page-image" }}
<div class="container">
  <div class="row">
    <div class="col col-12">
      <div class="{{$c}} animate">
        <img loading="lazy" src="{{ printf "%s%s" site.Params.asset_base_url (strings.TrimPrefix "/" .image) }}" alt="{{ .image_alt }}">
      </div>
    </div>
  </div>
</div>
