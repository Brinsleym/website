<!-- begin pagination -->
<nav class="pagination">
  <div class="container">
    <div class="pagination__inner">

      <div class="pagination__list">
        
        <a data-pagebreak-control="prev" href="." class="pagination__prev"><ion-icon name="arrow-back"></ion-icon> {{ T "prev_key" "Prev" }}</a>
        <span data-pagebreak-control="!prev" class="pagination__prev disabled">{{ T "prev_key" "Prev" }}</span>

        <div class="pagination__count">
          Page <span data-pagebreak-label="current">1</span>
          of <span data-pagebreak-label="total">1</span>
        </div>

        <a data-pagebreak-control="next" href="." class="pagination__next">{{ T "next_key" "Next" }}</a>
        <span data-pagebreak-control="!next" class="pagination__next disabled">{{ T "next_key" "Next" }}</span>
      </div>

    </div>
  </div>
</nav>
  <!-- end pagination -->
