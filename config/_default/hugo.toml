baseURL = "https://brinsleymorrison.com"
locale = "en"
title = "Brinsley Morrison"
_enabled_editors = ["visual", "content"]

defaultContentLanguage = "en"
ignoreFiles = ['\.bck$']
enableRobotsTXT = true

# llms.txt (https://llmstxt.org) and a full-text companion, built for each language
[outputFormats]
  [outputFormats.llms]
    baseName = "llms"
    mediaType = "text/plain"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    baseName = "llms-full"
    mediaType = "text/plain"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["html", "rss", "llms", "llmsfull"]

[languages]
  [languages.en]
    label = "English"
    locale = 'en-GB'

    weight = 1
    title = "Brinsley Morrison"
    contentDir = "content/en"

    [languages.en.params]
        date_format = "02 Jan 2006"
    

  [languages.ja]
    label = "日本語"
    locale = 'ja'

    weight = 2
    title = "森沢淋"
    contentDir = "content/ja"

    [languages.ja.params]
      date_format = "2006年01月02日"

  [languages.zh]
    label = "中文"
    locale = 'zh'

    weight = 3
    title = "林泽"
    contentDir = "content/zh"

    [languages.zh.params]
      date_format = "2006年01月02日"


[module]
replacements = "local/component-library -> ../component-library"

[[module.imports]]
path = 'local/component-library'

[[module.imports]]
path = 'github.com/cloudcannon/bookshop/hugo/v3'

[markup.goldmark.renderer]
hardWraps = true
unsafe = true

[permalinks]
posts = "/compositions/:title/"
projects = "/blog/:title/"
  # Compositions and blog posts keep separate tag vocabularies, each listed
  # under its own section rather than in one shared /tags/ index.
  [permalinks.taxonomy]
  tags = "/compositions/tags/"
  blog_tags = "/blog/tags/"
  [permalinks.term]
  tags = "/compositions/tags/:slug/"
  blog_tags = "/blog/tags/:slug/"

[params]
jsdelivr_base_url = "https://cdn.jsdelivr.net/gh/Brinsleym/website@master"

[related]
includeNewer = true
threshold = 0
toLower = true
  [[related.indices]]
  name = "tags"
  weight = 100
  [[related.indices]]
  name = "blog_tags"
  weight = 100

[taxonomies]
tag = "tags"
blog_tag = "blog_tags"

# Testimonials only feed the homepage slider: keep them listable,
# but don't publish a page for each one (or the section itself).
[[cascade]]
  [cascade.build]
    render = "never"
    list = "always"
  [cascade.target]
    path = "{/testimonials,/testimonials/**}"
