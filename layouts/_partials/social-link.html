{{ if hugo.Data.social_links.social }}
  <div class="social">
    <ul class="social__list list-reset">
      {{ range hugo.Data.social_links.social }}
      <li class="social__item{{ if eq .icon "mail" }} social__item--mail{{ end }}">
        {{ if eq .icon "mail" }}
          <a class="social__link social__link--mail" data-eml="{{ partial "email-encoded.html" }}" target="_blank" rel="noopener"
            aria-label="{{ or .label .icon }}"><ion-icon name="{{ lower .icon }}" aria-hidden="true"></ion-icon></a>
          <div class="social__copy-feedback">
            {{ T "social_email_copied" }}
          </div>
        {{ else }}
          <a class="social__link" href="{{ .link }}" target="_blank" rel="noopener"
            aria-label="{{ or .label .icon }}"><ion-icon name="{{ lower .icon }}" aria-hidden="true"></ion-icon></a>
        {{ end }}
      </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
