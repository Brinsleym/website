{{ if hugo.IsMultilingual }}
            <div class="language-switcher-title">{{ i18n "change_language" }}:</div> <div class="dropdown">
                <button class="dropbtn">{{ .Site.Language.Label }}
                </button>
                <div class="dropdown-content">
                    {{ range $.Translations }}
                    <a title="{{ .Language.Label }}" href="{{ .Permalink }}" data-lang="{{ .Language.Lang }}">{{
                        .Language.Label }}</a>
                    {{ end }}
                </div>
            </div>
            <script>
              // Remember the visitor's language so the Cloudflare worker's country
              // redirect on "/" doesn't override an explicit choice (e.g. English from China).
              (function () {
                function remember(lang) {
                  document.cookie = 'lang=' + lang + '; path=/; max-age=31536000; SameSite=Lax' +
                    (location.protocol === 'https:' ? '; Secure' : '');
                }
                remember({{ site.Language.Lang }});
                document.querySelectorAll('.dropdown-content a[data-lang]').forEach(function (link) {
                  link.addEventListener('click', function () { remember(link.dataset.lang); });
                });
              })();
            </script>
     {{ end }}
