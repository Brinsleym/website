<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        const path = window.location.pathname;
        if (path.startsWith('/ja/')) {
            window.location.href = 'https://brinsleymorrison.com/ja/';
        } 
        else if (path.startsWith('/zh/')) {
            window.location.href = 'https://brinsleymorrison.com/zh/';
        }
        else {
            window.location.href = 'https://brinsleymorrison.com';
        }
    </script>
    <!-- Fallback meta refresh if JavaScript is disabled -->
    <meta http-equiv="refresh" content="0; url=https://brinsleymorrison.com" />
</head>
<body>
    <p>If you are not redirected automatically, <a href="https://brinsleymorrison.com">click here</a>.</p>
</body>
