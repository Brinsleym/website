<div id="adobe-dc-view" style="
      width: 80vw; 
      height: 80vh;
      max-width: 100%; 
      max-height: 100%;">
      </div>
      <script src="https://acrobatservices.adobe.com/view-sdk/viewer.js"></script>
      <script type="text/javascript">
      const previewConfig = {
        embedMode: "FULL_WINDOW",
        showAnnotationTools: false,
        includePDFAnnotations: false,
        defaultViewMode: "CONTINUOUS",
        showDownloadPDF: true,
        enableFormFilling: false,
        showPrintPDF: true,
        enableSearchAPIs: false,
        showBookmarks: false
        }

        document.addEventListener("adobe_dc_view_sdk.ready", function(){ 
        	var adobeDCView = new AdobeDC.View({clientId: "08df5171d9244eb09764c0831d32afc2", divId: "adobe-dc-view"});
        	adobeDCView.previewFile({
      			content:{location: {url: "https://brinsleymorrison.com/assets/doc/cv.pdf"}},
      			metaData:{fileName: "Brinsley Morrison CV.pdf"}
      		}, previewConfig);
        });
      </script>
