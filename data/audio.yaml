#-------------------------------
# Self-hosted audio
#
# Our own copies of the SoundCloud audio, played where SoundCloud cannot be
# reached: straight away for visitors in mainland China, and anywhere else
# once SoundCloud fails to answer (a privacy extension, an outage). A player
# with no entry here stays SoundCloud-only.
#
# Files go in static/audio as AAC in an .mp4 container: jsDelivr's China
# mirror, which the zh site uses, serves .mp4 but not .m4a or .mp3. For
# example: ffmpeg -i master.wav -vn -c:a aac -b:a 160k -movflags +faststart x.mp4
#
# tracks     keyed by the soundcloud-player shortcode's `track`, exactly as
#            written in the content
# playlists  keyed by the soundcloud-playlist shortcode's `playlist`, each
#            with its tracks in playing order and optionally an artwork that
#            every track without its own uses
#
# Each track takes a title and a file, and optionally an artist (defaults to
# the one below), artwork (a square image in static/images, .webp so the
# China mirror serves it) and a duration in seconds for the playlist's track
# list. A single player shows its artwork only when it has no background.
#
# tracks:
#   "https://soundcloud.com/brinsleymorrison/somnolence":
#     title: Somnolence
#     file: /static/audio/somnolence.mp4
#     artwork: /static/images/somnolence-artwork.webp
# playlists:
#   "2034380025":
#     artwork: /static/images/frieren-artwork.webp
#     tracks:
#       - title: Journey's End
#         file: /static/audio/frieren-1.mp4
#         duration: 214
#-------------------------------
artist: Brinsley Morrison
tracks:
  "https://soundcloud.com/brinsleymorrison/somnolence":
